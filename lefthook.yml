pre-commit:
  parallel: true
  jobs:
    - run: npm run format:fix '{staged_files}'
      stage_fixed: true

    - run: npm run eslint:fix '{staged_files}'
      glob:
        - "*.ts"
        - "*.js"
        - "*.tsx"
        - "*.jsx"
      stage_fixed: true

